<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p>Turn any photo and caption into GTA-style multi-panel cover art, exported as a PNG to share. Everything runs offline; photos never leave this machine.</p>

    <fieldset>
      <legend>Photos</legend>
      <label>Hero photo <input id="photo" type="file" accept="image/*"></label>
      <label>Second photo <input id="photo2" type="file" accept="image/*"></label>
      <div class="samples">
        <button type="button" data-sample="boulevard">Boulevard sample</button>
        <button type="button" data-sample="pier">Pier sample</button>
        <button type="button" data-sample="pier" data-slot="2">Pier as second</button>
        <button type="button" data-sample="boulevard" data-slot="2">Boulevard as second</button>
      </div>
      <p class="hint">Drag the cover to pan the hero photo.</p>
    </fieldset>

    <fieldset>
      <legend>Lettering</legend>
      <label>Title <input id="title" type="text" maxlength="40" value="SUNSET BAY"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="60" value="HEIST · CHASE · ESCAPE"></label>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <label class="radio"><input type="radio" name="layout" value="grid" checked> Hero + two panels</label>
      <label class="radio"><input type="radio" name="layout" value="duo"> Split duo</label>
      <label class="radio"><input type="radio" name="layout" value="triptych"> Triptych</label>
      <label class="radio"><input type="radio" name="layout" value="poster"> Full poster</label>
    </fieldset>

    <fieldset>
      <legend>Look</legend>
      <label>Colour grade
        <select id="grade">
          <option value="sunset" selected>Sunset</option>
          <option value="neon">Neon nights</option>
          <option value="noir">Noir</option>
          <option value="pastel">Pastel</option>
        </select>
      </label>
      <label>Hero zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label class="radio"><input id="art" type="checkbox" checked> Sun &amp; palm art</label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <label>Size
        <select id="size">
          <option value="1080x1080" selected>1080 × 1080 (square post)</option>
          <option value="1080x1350">1080 × 1350 (portrait post)</option>
          <option value="1920x1080">1920 × 1080 (wide post)</option>
        </select>
      </label>
      <button id="export" type="button">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <img id="export-image" alt="The exported cover" hidden>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
